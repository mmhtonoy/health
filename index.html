<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>NEOBODY</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

:root{
    --bg:#05071c;
    --panel:#0b1030;
    --panel2:#101642;
    --blue:#4d8dff;
    --cyan:#00d9ff;
    --purple:#8b5cff;
    --pink:#ff4d9d;
    --green:#21e6a0;
    --orange:#ffad3d;
    --text:#f5f7ff;
    --muted:#7f89b5;
    --line:rgba(91,125,255,.25);
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    overflow-x:hidden;
}

/* NEON BACKGROUND */

body::before{
    content:"";
    position:fixed;
    width:500px;
    height:500px;
    left:-250px;
    top:-200px;
    background:radial-gradient(circle,
        rgba(72,89,255,.28),
        transparent 65%);
    filter:blur(20px);
    z-index:-2;
}

body::after{
    content:"";
    position:fixed;
    width:500px;
    height:500px;
    right:-280px;
    bottom:-250px;
    background:radial-gradient(circle,
        rgba(0,217,255,.18),
        transparent 65%);
    filter:blur(25px);
    z-index:-2;
}

.grid{
    position:fixed;
    inset:0;
    background-image:
        linear-gradient(rgba(60,90,255,.035) 1px,transparent 1px),
        linear-gradient(90deg,rgba(60,90,255,.035) 1px,transparent 1px);
    background-size:35px 35px;
    mask-image:linear-gradient(to bottom,black,transparent);
    pointer-events:none;
    z-index:-1;
}

/* APP */

.app{
    width:100%;
    max-width:520px;
    margin:auto;
    padding:22px 18px 100px;
}

/* HEADER */

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:28px;
}

.brand{
    display:flex;
    align-items:center;
    gap:12px;
}

.logo{
    width:48px;
    height:48px;
    border-radius:15px;
    display:grid;
    place-items:center;
    background:linear-gradient(145deg,#151c59,#080b28);
    border:1px solid rgba(77,141,255,.6);
    box-shadow:
        0 0 15px rgba(77,141,255,.4),
        inset 0 0 20px rgba(77,141,255,.08);
}

.logo svg{
    width:28px;
    fill:none;
    stroke:var(--cyan);
    stroke-width:2;
}

.brand h1{
    font-size:21px;
    letter-spacing:2px;
}

.brand span{
    display:block;
    font-size:10px;
    color:var(--muted);
    letter-spacing:1.5px;
    margin-top:3px;
}

.status{
    width:11px;
    height:11px;
    border-radius:50%;
    background:var(--green);
    box-shadow:0 0 12px var(--green);
}

/* GREETING & LIVE LOCATION BOX */

.greeting{
    margin-bottom:22px;
}

.location-box {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 14px;
    border: 1px solid var(--cyan);
    border-radius: 20px;
    background: rgba(0, 217, 255, 0.08);
    box-shadow: 0 0 12px rgba(0, 217, 255, 0.25);
    margin-bottom: 10px;
}

.location-icon {
    width: 14px;
    height: 14px;
    fill: none;
    stroke: var(--cyan);
    stroke-width: 2.5;
}

#locationText {
    font-size: 10px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--cyan);
    font-weight: 600;
}

.greeting h2{
    margin-top:4px;
    font-size:28px;
}

/* MAIN CARD */

.hero{
    position:relative;
    overflow:hidden;
    padding:23px;
    border:1px solid rgba(77,141,255,.45);
    border-radius:25px;
    background:
        linear-gradient(145deg,
        rgba(19,28,83,.92),
        rgba(7,10,35,.95));
    box-shadow:
        0 0 30px rgba(53,93,255,.14),
        inset 0 0 30px rgba(52,75,255,.05);
    margin-bottom:18px;
}

.hero::before{
    content:"";
    position:absolute;
    width:180px;
    height:180px;
    right:-80px;
    top:-90px;
    background:radial-gradient(circle,
        rgba(0,217,255,.22),
        transparent 70%);
}

.hero-title{
    color:#9da9e0;
    font-size:12px;
    letter-spacing:2px;
    text-transform:uppercase;
}

.hero-value{
    font-size:48px;
    font-weight:700;
    margin-top:9px;
}

.hero-value span{
    font-size:16px;
    color:var(--cyan);
    font-weight:500;
}

.pulse-line{
    height:55px;
    margin-top:15px;
    overflow:hidden;
}

.pulse-line svg{
    width:100%;
    height:100%;
}

.pulse-path{
    fill:none;
    stroke:var(--cyan);
    stroke-width:2;
    filter:drop-shadow(0 0 6px var(--cyan));
    stroke-dasharray:500;
    animation:dash 3s linear infinite;
}

@keyframes dash{
    to{stroke-dashoffset:-500;}
}

.measure{
    display:flex;
    align-items:center;
    gap:8px;
    color:var(--green);
    font-size:12px;
    margin-top:8px;
}

.measure i{
    width:7px;
    height:7px;
    background:var(--green);
    border-radius:50%;
    box-shadow:0 0 8px var(--green);
}

/* GRID */

.metrics{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
}

.card{
    min-height:175px;
    padding:18px;
    border-radius:21px;
    background:linear-gradient(145deg,
        rgba(16,22,65,.95),
        rgba(7,10,34,.95));
    border:1px solid var(--line);
    box-shadow:
        0 10px 30px rgba(0,0,0,.18),
        inset 0 0 25px rgba(75,100,255,.035);
    position:relative;
    overflow:hidden;
}

.card::after{
    content:"";
    position:absolute;
    width:100px;
    height:100px;
    right:-50px;
    bottom:-50px;
    border-radius:50%;
    background:radial-gradient(circle,
        rgba(0,217,255,.14),
        transparent 70%);
}

.iconbox{
    width:48px;
    height:48px;
    display:grid;
    place-items:center;
    border-radius:15px;
    margin-bottom:15px;
}

.iconbox svg{
    width:27px;
    height:27px;
    fill:none;
    stroke-width:1.8;
}

.heart .iconbox{
    background:rgba(255,77,157,.09);
    border:1px solid rgba(255,77,157,.25);
}

.heart svg{
    stroke:var(--pink);
    filter:drop-shadow(0 0 5px var(--pink));
}

.temp .iconbox{
    background:rgba(0,217,255,.08);
    border:1px solid rgba(0,217,255,.25);
}

.temp svg{
    stroke:var(--cyan);
}

.steps .iconbox{
    background:rgba(33,230,160,.08);
    border:1px solid rgba(33,230,160,.25);
}

.steps svg{
    stroke:var(--green);
}

.foot .iconbox{
    background:rgba(255,173,61,.08);
    border:1px solid rgba(255,173,61,.25);
}

.foot svg{
    stroke:var(--orange);
}

.card-title{
    font-size:11px;
    color:var(--muted);
    letter-spacing:1.5px;
    text-transform:uppercase;
}

.card-value{
    margin-top:7px;
    font-size:27px;
    font-weight:700;
}

.card-value small{
    color:#8790b9;
    font-size:11px;
    font-weight:400;
}

.card-status{
    margin-top:7px;
    font-size:11px;
    color:var(--green);
}

/* SECTION */

.section-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:25px 2px 12px;
}

.section-title h3{
    font-size:15px;
}

.section-title span{
    color:var(--cyan);
    font-size:11px;
}

/* ACTIVITY */

.activity{
    padding:19px;
    border:1px solid var(--line);
    border-radius:21px;
    background:rgba(10,15,48,.85);
}

.activity-top{
    display:flex;
    justify-content:space-between;
}

.activity-value{
    font-size:30px;
    font-weight:bold;
}

.activity-label{
    font-size:11px;
    color:var(--muted);
    margin-top:3px;
}

.progress{
    height:7px;
    border-radius:10px;
    background:#151b45;
    overflow:hidden;
    margin-top:18px;
}

.progress div{
    height:100%;
    width:65%;
    border-radius:10px;
    background:linear-gradient(90deg,
        var(--purple),
        var(--cyan));
    box-shadow:0 0 12px var(--cyan);
    transition:width .4s;
}

/* BUTTON */

.test-btn{
    width:100%;
    margin-top:18px;
    padding:15px;
    border:none;
    border-radius:15px;
    color:white;
    font-weight:bold;
    letter-spacing:1px;
    background:linear-gradient(90deg,#4b43d7,#087fe8);
    box-shadow:0 0 20px rgba(57,103,255,.35);
    cursor:pointer;
}

.test-btn:active{
    transform:scale(.98);
}

/* BOTTOM NAV */

.nav{
    position:fixed;
    left:50%;
    bottom:15px;
    transform:translateX(-50%);
    width:calc(100% - 30px);
    max-width:490px;
    height:68px;
    border:1px solid rgba(77,141,255,.35);
    border-radius:22px;
    background:rgba(7,10,34,.92);
    backdrop-filter:blur(18px);
    display:flex;
    justify-content:space-around;
    align-items:center;
    box-shadow:0 0 30px rgba(35,70,255,.2);
    z-index:20;
}

.nav button{
    border:none;
    background:none;
    color:#606b9c;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:5px;
    font-size:9px;
    cursor:pointer;
}

.nav svg{
    width:22px;
    height:22px;
    fill:none;
    stroke:currentColor;
    stroke-width:1.8;
}

.nav button.active{
    color:var(--cyan);
    filter:drop-shadow(0 0 5px var(--cyan));
}

/* TOAST */

.toast{
    position:fixed;
    top:18px;
    left:50%;
    transform:translate(-50%,-100px);
    padding:12px 18px;
    border:1px solid rgba(0,217,255,.4);
    background:#0a1034;
    border-radius:12px;
    font-size:12px;
    box-shadow:0 0 20px rgba(0,217,255,.2);
    transition:.35s;
    z-index:100;
}

.toast.show{
    transform:translate(-50%,0);
}

/* RESPONSIVE */

@media(max-width:370px){
    .app{
        padding-left:13px;
        padding-right:13px;
    }

    .metrics{
        gap:9px;
    }

    .card{
        padding:14px;
    }

    .hero-value{
        font-size:42px;
    }
}
</style>
</head>

<body>

<div class="grid"></div>

<div class="toast" id="toast">Sensor test started</div>

<div class="app">

    <header class="header">

        <div class="brand">

            <div class="logo">
                <svg viewBox="0 0 32 32">
                    <circle cx="16" cy="16" r="11"/>
                    <path d="M10 16h3l2-5 3 10 2-5h3"/>
                </svg>
            </div>

            <div>
                <h1>NEOBODY</h1>
                <span>BODY MONITOR SYSTEM</span>
            </div>

        </div>

        <div class="status"></div>

    </header>


    <div class="greeting">
        <div class="location-box">
            <svg class="location-icon" viewBox="0 0 24 24">
                <path d="M12 2C8.1 2 5 5.1 5 9c0 5.2 7 13 7 13s7-7.8 7-13c0-3.9-3.1-7-7-7zm0 9.5c-1.4 0-2.5-1.1-2.5-2.5s1.1-2.5 2.5-2.5 2.5 1.1 2.5 2.5-1.1 2.5-2.5 2.5z"/>
            </svg>
            <span id="locationText">LOCATING...</span>
        </div>
        <h2>Hello, Noman</h2>
    </div>


    <!-- HEART -->

    <div class="hero">

        <div class="hero-title">Heart Rate Monitor</div>

        <div class="hero-value">
            <span id="heartRate">78</span>
            <span>BPM</span>
        </div>

        <div class="pulse-line">

            <svg viewBox="0 0 500 60" preserveAspectRatio="none">

                <path class="pulse-path"
                d="M0 30
                L50 30
                L65 30
                L75 12
                L88 49
                L102 30
                L160 30
                L175 30
                L190 8
                L204 51
                L217 30
                L280 30
                L295 30
                L310 14
                L325 48
                L338 30
                L400 30
                L415 30
                L430 10
                L445 50
                L458 30
                L500 30"/>
                
            </svg>

        </div>

        <div class="measure">
            <i></i>
            Demo sensor ready
        </div>

        <button class="test-btn" onclick="startHeartTest()">
            START HEART TEST
        </button>

    </div>


    <!-- METRICS -->

    <div class="metrics">

        <!-- TEMPERATURE -->

        <div class="card temp">

            <div class="iconbox">

                <svg viewBox="0 0 32 32">
                    <path d="M16 6a4 4 0 0 0-4 4v10a6 6 0 1 0 8 0V10a4 4 0 0 0-4-4z"/>
                    <path d="M16 14v9"/>
                    <path d="M21 11h4"/>
                    <path d="M21 15h3"/>
                    <path d="M21 19h4"/>
                </svg>

            </div>

            <div class="card-title">Body Temp</div>

            <div class="card-value">
                <span id="temperature">36.6</span>
                <small>°C</small>
            </div>

            <div class="card-status">Demo Reading</div>

        </div>


        <!-- STEPS -->

        <div class="card steps">

            <div class="iconbox">

                <svg viewBox="0 0 32 32">
                    <path d="M13 5c3 0 5 3 5 7 0 5-2 9-5 11-3 2-6 0-6-3 0-4 2-8 3-11 1-3 1-4 3-4z"/>
                    <path d="M21 9c3 0 5 3 5 7 0 5-2 9-5 11-3 2-6 0-6-3 0-4 2-8 3-11 1-3 1-4 3-4z"/>
                </svg>

            </div>

            <div class="card-title">Steps</div>

            <div class="card-value">
                <span id="steps">0</span>
            </div>

            <div class="card-status">Motion Sensor</div>

        </div>


        <!-- FOOTSTEPS -->

        <div class="card foot">

            <div class="iconbox">

                <svg viewBox="0 0 32 32">
                    <circle cx="16" cy="16" r="11"/>
                    <path d="M16 5v4"/>
                    <path d="M16 23v4"/>
                    <path d="M5 16h4"/>
                    <path d="M23 16h4"/>
                    <circle cx="16" cy="16" r="3"/>
                </svg>

            </div>

            <div class="card-title">Activity</div>

            <div class="card-value">
                <span id="activity">Idle</span>
            </div>

            <div class="card-status">Live Detection</div>

        </div>


        <!-- SENSOR -->

        <div class="card heart">

            <div class="iconbox">

                <svg viewBox="0 0 32 32">
                    <path d="M16 27S5 20 5 12c0-4 3-7 7-7 2 0 4 1 4 3 0-2 2-3 4-3 4 0 7 3 7 7 0 8-11 15-11 15z"/>
                </svg>

            </div>

            <div class="card-title">Sensor</div>

            <div class="card-value" style="font-size:21px;">
                READY
            </div>

            <div class="card-status">System Online</div>

        </div>

    </div>


    <!-- DAILY PROGRESS -->

    <div class="section-title">
        <h3>Daily Activity</h3>
        <span>10,000 GOAL</span>
    </div>

    <div class="activity">

        <div class="activity-top">

            <div>
                <div class="activity-value">
                    <span id="dailySteps">0</span>
                </div>

                <div class="activity-label">
                    steps today
                </div>
            </div>

            <div style="text-align:right;">
                <div style="font-size:20px;font-weight:bold;" id="percent">
                    0%
                </div>

                <div class="activity-label">
                    progress
                </div>
            </div>

        </div>

        <div class="progress">
            <div id="progressBar"></div>
        </div>

    </div>


</div>


<!-- NAVIGATION -->

<nav class="nav">

    <button class="active" onclick="navClick(this)">

        <svg viewBox="0 0 32 32">
            <path d="M5 14l11-9 11 9v13H19v-8h-6v8H5z"/>
        </svg>

        HOME
    </button>


    <button onclick="navClick(this)">

        <svg viewBox="0 0 32 32">
            <circle cx="16" cy="16" r="11"/>
            <path d="M16 10v7l5 3"/>
        </svg>

        HISTORY
    </button>


    <button onclick="navClick(this)">

        <svg viewBox="0 0 32 32">
            <path d="M3 16h6l3-8 5 16 3-8h9"/>
        </svg>

        MONITOR
    </button>


    <button onclick="navClick(this)">

        <svg viewBox="0 0 32 32">
            <circle cx="16" cy="16" r="4"/>
            <path d="M16 4v5M16 23v5M4 16h5M23 16h5"/>
            <path d="M8 8l4 4M20 20l4 4M24 8l-4 4M12 20l-4 4"/>
        </svg>

        SETTINGS
    </button>

</nav>


<script>

/* =========================
   VARIABLES
========================= */

let steps = 0;
let lastAcceleration = 0;
let lastStepTime = 0;


/* =========================
   TOAST
========================= */

function showToast(text){

    const toast = document.getElementById("toast");

    toast.textContent = text;

    toast.classList.add("show");

    setTimeout(()=>{
        toast.classList.remove("show");
    },2200);
}


/* =========================
   HEART TEST
========================= */

function startHeartTest(){

    showToast("Heart sensor test started");

    let value = 72;

    const timer = setInterval(()=>{

        value += Math.floor(Math.random()*7)-3;

        if(value < 65) value = 65;
        if(value > 90) value = 90;

        document.getElementById("heartRate").textContent = value;

    },700);

    setTimeout(()=>{
        clearInterval(timer);
        showToast("Heart test finished");
    },7000);
}


/* =========================
   MOTION SENSOR
========================= */

function motionHandler(event){

    const acc = event.accelerationIncludingGravity;

    if(!acc) return;

    const x = acc.x || 0;
    const y = acc.y || 0;
    const z = acc.z || 0;

    const magnitude =
        Math.sqrt(x*x + y*y + z*z);

    const now = Date.now();

    if(
        magnitude > 12 &&
        now - lastStepTime > 350
    ){

        steps++;

        lastStepTime = now;

        updateSteps();

        document.getElementById("activity")
            .textContent = "Walking";
    }

}


/* =========================
   UPDATE STEPS
========================= */

function updateSteps(){

    document.getElementById("steps")
        .textContent = steps.toLocaleString();

    document.getElementById("dailySteps")
        .textContent = steps.toLocaleString();

    let percent =
        Math.min(100,Math.round((steps/10000)*100));

    document.getElementById("percent")
        .textContent = percent + "%";

    document.getElementById("progressBar")
        .style.width = percent + "%";
}


/* =========================
   LIVE LOCATION SENSOR
========================= */

function initLiveLocation() {
    const locationElement = document.getElementById("locationText");

    if ("geolocation" in navigator) {
        navigator.geolocation.watchPosition(
            async (position) => {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;

                try {
                    const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`);
                    const data = await response.json();
                    const address = data.address;
                    
                    const locationName = address.city || address.town || address.village || address.suburb || address.county || "Live Location";
                    const countryName = address.country || "";

                    locationElement.textContent = `${locationName}, ${countryName}`;
                } catch (error) {
                    locationElement.textContent = `${lat.toFixed(2)}, ${lon.toFixed(2)}`;
                }
            },
            (error) => {
                locationElement.textContent = "Permission Denied";
                showToast("Location permission needed for live tracking");
            },
            {
                enableHighAccuracy: true,
                maximumAge: 10000,
                timeout: 20000
            }
        );
    } else {
        locationElement.textContent = "Not Supported";
    }
}


/* =========================
   START SENSOR
========================= */

async function enableMotion(){

    try{

        if(
            typeof DeviceMotionEvent !== "undefined" &&
            typeof DeviceMotionEvent.requestPermission === "function"
        ){

            const permission =
                await DeviceMotionEvent.requestPermission();

            if(permission !== "granted"){
                showToast("Motion permission denied");
                return;
            }
        }

        window.addEventListener(
            "devicemotion",
            motionHandler
        );

        showToast("Sensors connected");

    }catch(error){

        showToast("Motion sensor unavailable");

    }

}


/* =========================
   NAVIGATION
========================= */

function navClick(button){

    document
        .querySelectorAll(".nav button")
        .forEach(btn=>{
            btn.classList.remove("active");
        });

    button.classList.add("active");

    showToast(button.innerText + " selected");
}


/* =========================
   START
========================= */

window.addEventListener(
    "load",
    () => {
        enableMotion();
        initLiveLocation();
    }
);

</script>

</body>
</html>
